<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0b0b0b}
      .s{font-size:12px;fill:#52514e}
      .m{font-family:JetBrains Mono, Consolas, monospace;font-size:11.5px;fill:#2a78d6}
      .h{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#52514e}
      .box{fill:#ffffff;stroke:#d9d6cf;stroke-width:1.2}
      .cv{fill:#eef4fc;stroke:#2a78d6;stroke-width:1.2}
      .aws{fill:#fff4ec;stroke:#eb6834;stroke-width:1.2}
      .ln{stroke:#52514e;stroke-width:1.5;fill:none}
      .lo{stroke:#eb6834;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1200" height="770" fill="#fcfcfb"/>
  <text x="28" y="40" font-size="22" font-weight="700" fill="#0b0b0b">BoilGuard architecture</text>
  <text x="28" y="62" class="s">Same container image runs at the stove (edge) and on AWS Lambda. Blue = OpenCV 5, orange = AWS.</text>

  <!-- Kitchen -->
  <text x="28" y="104" class="h">KITCHEN</text>
  <rect x="28" y="114" width="200" height="88" rx="10" class="box"/>
  <text x="44" y="140" class="t">Range-hood camera</text>
  <text x="44" y="160" class="s">looks down at the pot,</text>
  <text x="44" y="176" class="s">10-30 fps, any webcam</text>
  <rect x="28" y="560" width="200" height="140" rx="10" class="box"/>
  <text x="44" y="586" class="t">Devices</text>
  <text x="44" y="608" class="s">smart plug / IoT hob</text>
  <text x="44" y="626" class="s">(set_heat 0.35 / 0)</text>
  <text x="44" y="648" class="s">hood fan, buzzer</text>
  <text x="44" y="670" class="s">subscribe MQTT</text>
  <text x="44" y="688" class="m">boilguard/&lt;id&gt;/cmd</text>

  <!-- Vision pipeline -->
  <text x="268" y="104" class="h">PERCEPTION · OpenCV 5</text>
  <rect x="268" y="114" width="410" height="300" rx="12" class="cv"/>
  <text x="288" y="142" class="t">Calibrate once (calm pot)</text>
  <text x="288" y="162" class="m">CLAHE · Canny · findContours · fitEllipse</text>
  <text x="288" y="180" class="m">remap polar · Sobel · lip-edge fitEllipse</text>
  <line x1="288" y1="194" x2="658" y2="194" stroke="#c9dbf3"/>
  <text x="288" y="218" class="t">Every analysed frame (2-10 Hz, adaptive)</text>
  <text x="288" y="240" class="m">1 phaseCorrelate + Hanning  → stabilise</text>
  <text x="288" y="260" class="m">2 remap → elliptical polar unwrap</text>
  <text x="288" y="280" class="m">3 haze model I = J·t + A(1−t) on rim lip</text>
  <text x="288" y="300" class="m">4 colour distance to calm wall (± 1 px)</text>
  <text x="288" y="320" class="m">5 per-angle change point → foam front</text>
  <text x="288" y="340" class="m">6 median + MAD → confidence, occlusion</text>
  <text x="288" y="360" class="m">7 pinhole depth d = H(r_rim/r − 1)</text>
  <text x="288" y="380" class="m">8 calcOpticalFlowFarneback → agitation</text>
  <text x="288" y="402" class="s">≈17-25 ms per frame on one CPU core</text>

  <!-- Prediction -->
  <text x="268" y="452" class="h">PREDICTION</text>
  <rect x="268" y="462" width="410" height="120" rx="12" class="cv"/>
  <text x="288" y="490" class="t">Physics-informed foam model</text>
  <text x="288" y="512" class="m">cv2.KalmanFilter  x = [log foam, k, dk/dt]</text>
  <text x="288" y="532" class="s">exponential growth → saturation; noise from vision confidence</text>
  <text x="288" y="552" class="s">Monte-Carlo posterior → P(spill within hob heat lag), ETA p10/p50</text>
  <text x="288" y="570" class="s">plateau ⇒ "no overflow" (keeps false cuts down)</text>

  <!-- Agent -->
  <text x="268" y="620" class="h">AGENT</text>
  <rect x="268" y="630" width="410" height="100" rx="12" class="box"/>
  <text x="288" y="656" class="t">Perceive → decide → act → verify</text>
  <text x="288" y="676" class="s">alert · reduce heat (cancel window / ask first / notify only)</text>
  <text x="288" y="694" class="s">verify foam reverses, else burner OFF + alarm</text>
  <text x="288" y="712" class="s">steam hides rim → hood fan ON (active perception)</text>

  <!-- AWS -->
  <text x="728" y="104" class="h">AWS</text>
  <rect x="728" y="114" width="440" height="616" rx="14" fill="#fffaf6" stroke="#f3c7b0"/>
  <rect x="748" y="130" width="400" height="92" rx="10" class="aws"/>
  <text x="764" y="156" class="t">AWS Lambda (container image)</text>
  <text x="764" y="176" class="s">FastAPI via Lambda Web Adapter · Function URL</text>
  <text x="764" y="194" class="s">runs the full pipeline: /api/simulate, /api/analyze</text>
  <text x="764" y="212" class="s">Amazon ECR holds the image (built by SAM)</text>

  <rect x="748" y="238" width="190" height="92" rx="10" class="aws"/>
  <text x="764" y="264" class="t">AWS IoT Core</text>
  <text x="764" y="284" class="s">MQTT device commands</text>
  <text x="764" y="302" class="s">topic rule → S3 audit</text>
  <text x="764" y="320" class="s">of every actuation</text>

  <rect x="958" y="238" width="190" height="92" rx="10" class="aws"/>
  <text x="974" y="264" class="t">Amazon SNS</text>
  <text x="974" y="284" class="s">phone / e-mail alerts</text>
  <text x="974" y="302" class="s">alarm on API errors</text>

  <rect x="748" y="346" width="190" height="92" rx="10" class="aws"/>
  <text x="764" y="372" class="t">Amazon Bedrock</text>
  <text x="764" y="392" class="s">Nova Lite (Converse API)</text>
  <text x="764" y="410" class="s">notification + incident</text>
  <text x="764" y="428" class="s">report text; never decides</text>

  <rect x="958" y="346" width="190" height="92" rx="10" class="aws"/>
  <text x="974" y="372" class="t">Amazon S3</text>
  <text x="974" y="392" class="s">annotated video, trace</text>
  <text x="974" y="410" class="s">presigned links · SSE</text>
  <text x="974" y="428" class="s">7-day lifecycle</text>

  <rect x="748" y="454" width="400" height="92" rx="10" class="aws"/>
  <text x="764" y="480" class="t">Amazon CloudWatch</text>
  <text x="764" y="500" class="s">Embedded Metric Format: VisionMsPerFrame, Overflowed,</text>
  <text x="764" y="518" class="s">ToolCalls, RunSeconds · dashboard · error alarm · logs</text>

  <rect x="748" y="562" width="400" height="80" rx="10" class="aws"/>
  <text x="764" y="588" class="t">AWS SAM / CloudFormation</text>
  <text x="764" y="608" class="s">one template: least-privilege IAM, IoT topic scope,</text>
  <text x="764" y="626" class="s">GitHub Actions one-click deploy + smoke test</text>

  <rect x="748" y="658" width="400" height="56" rx="10" class="box"/>
  <text x="764" y="682" class="t">Judges / cook: browser</text>
  <text x="764" y="700" class="s">web UI on the Function URL</text>

  <!-- arrows -->
  <path d="M228 158 H268" class="ln" marker-end="url(#a)"/>
  <path d="M473 414 V462" class="ln" marker-end="url(#a)"/>
  <path d="M473 582 V630" class="ln" marker-end="url(#a)"/>
  <path d="M268 680 H246 V640 H228" class="lo" marker-end="url(#o)"/>
  <path d="M678 680 H708 V284 H748" class="lo" marker-end="url(#o)"/>
  <path d="M708 284 V300" class="lo"/>
  <path d="M708 392 H748" class="lo" marker-end="url(#o)"/>
  <path d="M938 284 H958" class="lo" marker-end="url(#o)"/>
  <path d="M843 238 V222" class="ln"/>
  <path d="M748 316 H720 V748 H128 V704" class="lo" marker-end="url(#o)" stroke-dasharray="5 4"/>
  <text x="300" y="742" class="s" fill="#eb6834">MQTT command from IoT Core → device (dashed)</text>
</svg>
