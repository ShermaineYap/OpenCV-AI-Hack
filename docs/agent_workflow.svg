<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0b0b0b}
      .s{font-size:12px;fill:#52514e}
      .e{font-size:11.5px;fill:#2a78d6;font-family:JetBrains Mono, Consolas, monospace}
      .x{font-size:11.5px;fill:#b5441a;font-family:JetBrains Mono, Consolas, monospace}
      .st{fill:#ffffff;stroke:#d9d6cf;stroke-width:1.3}
      .p{fill:#eef4fc;stroke:#2a78d6;stroke-width:1.3}
      .ac{fill:#fff4ec;stroke:#eb6834;stroke-width:1.3}
      .hu{fill:#e9f6f0;stroke:#1baf7a;stroke-width:1.3}
      .ln{stroke:#52514e;stroke-width:1.5;fill:none}
      .lo{stroke:#eb6834;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fcfcfb"/>
  <text x="28" y="40" font-size="22" font-weight="700" fill="#0b0b0b">Agentic vision loop: visual evidence changes what happens next</text>
  <text x="28" y="62" class="s">Blue = OpenCV 5 perception outputs that drive each transition. Orange = tool calls. Green = human control.</text>

  <!-- perception strip -->
  <rect x="28" y="84" width="1144" height="70" rx="12" class="p"/>
  <text x="48" y="112" class="t">Perceive (every analysed frame)</text>
  <text x="48" y="134" class="e">freeboard_mm · confidence · fog (haze t) · lip_covered · overflow · agitation  →  Kalman: P(spill &lt; lag+3 s), P(&lt;20 s), ETA, growth k, fill</text>

  <!-- states -->
  <rect x="40" y="200" width="160" height="70" rx="12" class="st"/><text x="60" y="230" class="t">MONITOR</text><text x="60" y="250" class="s">analyse at 2 Hz</text>
  <rect x="270" y="200" width="160" height="70" rx="12" class="st"/><text x="290" y="230" class="t">BOILING</text><text x="290" y="250" class="s">analyse at 8 Hz</text>
  <rect x="500" y="200" width="160" height="70" rx="12" class="st"/><text x="520" y="230" class="t">ALERT</text><text x="520" y="250" class="s">analyse at 10 Hz</text>
  <rect x="740" y="200" width="190" height="70" rx="12" class="ac"/><text x="760" y="230" class="t">ACT</text><text x="760" y="250" class="s">set_heat(0.35) by mode</text>
  <rect x="1000" y="200" width="160" height="70" rx="12" class="st"/><text x="1020" y="230" class="t">VERIFY</text><text x="1020" y="250" class="s">watch growth k</text>
  <rect x="1000" y="380" width="160" height="70" rx="12" class="st"/><text x="1020" y="410" class="t">RESOLVED</text><text x="1020" y="430" class="s">heat stays LOW</text>
  <rect x="740" y="380" width="190" height="70" rx="12" class="ac"/><text x="760" y="410" class="t">ESCALATE</text><text x="760" y="430" class="s">set_heat(0) + alarm</text>
  <rect x="40" y="380" width="200" height="70" rx="12" class="ac"/><text x="60" y="410" class="t">SEE BETTER</text><text x="60" y="430" class="s">hood_fan(on), act earlier</text>
  <rect x="300" y="380" width="200" height="70" rx="12" class="ac"/><text x="320" y="410" class="t">OVERFLOW</text><text x="320" y="430" class="s">heat OFF, alarm, report</text>

  <!-- transitions -->
  <path d="M200 235 H270" class="ln" marker-end="url(#a)"/><text x="204" y="290" class="e">foam↑ or</text><text x="204" y="306" class="e">agitation</text>
  <path d="M430 235 H500" class="ln" marker-end="url(#a)"/><text x="502" y="290" class="e">P(&lt;20s)≥.5</text><text x="502" y="306" class="e">fill≥.25</text>
  <path d="M660 235 H740" class="ln" marker-end="url(#a)"/><text x="662" y="290" class="e">P(&lt;lag)≥.7, fill≥.4</text><text x="662" y="306" class="e">2× if conf&lt;.4</text>
  <path d="M930 235 H1000" class="ln" marker-end="url(#a)"/>
  <path d="M1080 270 V380" class="ln" marker-end="url(#a)"/><text x="1088" y="320" class="e">k&lt;0 for 2 s</text>
  <path d="M1000 260 C 960 300 930 340 900 380" class="lo" marker-end="url(#o)"/><text x="940" y="350" class="x">still rising</text><text x="940" y="364" class="x">after 1.5·lag+3 s</text>
  <path d="M120 270 V380" class="ln" marker-end="url(#a)"/><text x="128" y="320" class="e">fog≥.3 or conf&lt;.3</text><text x="128" y="336" class="e">for 1 s</text>
  <path d="M465 154 V380" class="ln" marker-end="url(#a)" stroke-dasharray="4 4"/><text x="473" y="340" class="e">rim lip covered</text><text x="473" y="356" class="e">3 frames (any state)</text>

  <!-- modes / human -->
  <rect x="28" y="490" width="560" height="126" rx="12" class="hu"/>
  <text x="48" y="518" class="t">Human control (autonomy modes)</text>
  <text x="48" y="542" class="s">auto_veto (default): announce, 3 s cancel window; act at once if ETA p10 &lt; lag + veto</text>
  <text x="48" y="562" class="s">ask_first: request approval; on timeout only sound the alarm</text>
  <text x="48" y="582" class="s">notify_only: never actuates. Cook takes over → agent stands down 20 s.</text>
  <text x="48" y="602" class="s">Restoring heat is always the cook's decision.</text>

  <rect x="612" y="490" width="560" height="126" rx="12" class="st"/>
  <text x="632" y="518" class="t">Tools</text>
  <text x="632" y="542" class="x">set_heat(level) · hood_fan(on) · alarm(on) · notify(severity, msg)</text>
  <text x="632" y="562" class="s">backends: simulator · AWS IoT Core MQTT (+ S3 audit rule) · SNS · dry-run</text>
  <text x="632" y="582" class="s">Bedrock Nova writes the message text; the policy alone decides actions.</text>
  <text x="632" y="602" class="s">Every decision is logged with the perception + forecast that caused it.</text>
</svg>
