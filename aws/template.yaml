AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  BoilGuard - physics-informed boil-over prevention (OpenCV 5 + AWS).
  Lambda container (FastAPI via Lambda Web Adapter) behind a Function URL,
  S3 evidence store, AWS IoT Core device-command channel with an audit rule,
  Amazon SNS alerts, Amazon Bedrock narration and CloudWatch observability.

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional e-mail address subscribed to BoilGuard alerts (SNS).
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: Bedrock model or inference profile used for notifications/reports.
  EnableBedrock:
    Type: String
    AllowedValues: ["0", "1"]
    Default: "1"

Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Timeout: 180
    MemorySize: 3008

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-runs
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: 7
          - Id: expire-device-audit
            Status: Enabled
            Prefix: device-audit/
            ExpirationInDays: 30

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BoilGuard
      KmsMasterKeyId: alias/aws/sns

  AlertsEmailSub:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 14

  BoilGuardFunction:
    Type: AWS::Serverless::Function
    DependsOn: FunctionLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      PackageType: Image
      Architectures: [x86_64]
      EphemeralStorage: { Size: 2048 }
      LoggingConfig:
        LogGroup: !Ref FunctionLogs
      Environment:
        Variables:
          BOILGUARD_BUCKET: !Ref ArtifactsBucket
          BOILGUARD_SNS_TOPIC: !Ref AlertsTopic
          BOILGUARD_IOT_ENABLED: "1"
          BOILGUARD_BEDROCK: !Ref EnableBedrock
          BOILGUARD_BEDROCK_MODEL: !Ref BedrockModelId
          BOILGUARD_MAX_CONCURRENT: "1"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: ["GET", "POST"]
      Policies:
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - Statement:
            - Sid: IotPublishBoilGuardTopicsOnly
              Effect: Allow
              Action: iot:Publish
              Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/boilguard/*
            - Sid: IotEndpoint
              Effect: Allow
              Action: iot:DescribeEndpoint
              Resource: "*"
            - Sid: BedrockConverse
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
    Metadata:
      DockerTag: v1
      DockerContext: ..
      Dockerfile: Dockerfile

  # Since Oct 2025 public function URLs need lambda:InvokeFunction as well as
  # lambda:InvokeFunctionUrl (SAM adds the latter). Scoped to URL invocations only.
  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BoilGuardFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Every command the agent sends to a stove/hood is copied to S3 for audit.
  DeviceAuditRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-audit
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ArtifactsBucket.Arn}/device-audit/*

  DeviceAuditRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Description: Archive BoilGuard device commands for audit
        Sql: "SELECT *, topic() AS topic, timestamp() AS received_ms FROM 'boilguard/+/cmd'"
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions:
          - S3:
              BucketName: !Ref ArtifactsBucket
              Key: "device-audit/${topic(2)}/${timestamp()}-${newuuid()}.json"
              RoleArn: !GetAtt DeviceAuditRole.Arn

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: BoilGuard API errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref BoilGuardFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Vision latency (ms/frame)","region":"${AWS::Region}","stat":"Average","period":300,
            "metrics":[["BoilGuard","VisionMsPerFrame","Endpoint","simulate"],["BoilGuard","VisionMsPerFrame","Endpoint","analyze"]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Runs, overflows and agent tool calls","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["BoilGuard","RunSeconds","Endpoint","simulate",{"stat":"SampleCount","label":"runs"}],["BoilGuard","Overflowed","Endpoint","simulate"],["BoilGuard","ToolCalls","Endpoint","simulate"]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Lambda duration / errors","region":"${AWS::Region}","period":300,
            "metrics":[["AWS/Lambda","Duration","FunctionName","${BoilGuardFunction}",{"stat":"p90"}],["AWS/Lambda","Errors","FunctionName","${BoilGuardFunction}",{"stat":"Sum","yAxis":"right"}]]}},
          {"type":"log","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Recent runs","region":"${AWS::Region}",
            "query":"SOURCE '/aws/lambda/${AWS::StackName}-api' | fields @timestamp, Endpoint, RunSeconds, Overflowed, ToolCalls | filter ispresent(RunSeconds) | sort @timestamp desc | limit 20"}}
        ]}

Outputs:
  AppUrl:
    Description: BoilGuard web app (give this to the judges)
    Value: !GetAtt BoilGuardFunctionUrl.FunctionUrl
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}
  IotTestTopic:
    Description: Subscribe to this in the AWS IoT MQTT test client to watch agent commands live
    Value: boilguard/+/cmd
