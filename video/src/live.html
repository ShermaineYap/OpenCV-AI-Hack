<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../brag-output/work/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../../brag-output/work/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../../brag-output/work/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../../brag-output/work/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:JBM;font-weight:500;src:url(../../brag-output/work/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
:root{--bg:#141311;--panel:#1d1c19;--ink:#f1ede6;--muted:#a39c90;--line:#2f2c27;--flame:#ff7a4d;--safe:#45c19f;--blue:#3987e5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}
#root{position:absolute;inset:0}
.cam{position:absolute;left:40px;top:110px;width:1290px;height:820px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000}
.cam img{width:100%;height:100%;display:block}
.hud{position:absolute;font:500 24px JBM,monospace;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.rec{display:inline-block;width:16px;height:16px;border-radius:50%;background:#ff3b30;margin-right:10px;vertical-align:-1px}
.title{position:absolute;left:40px;top:34px;font:800 46px Inter;letter-spacing:-.02em}
.phone{position:absolute;left:1390px;top:70px;width:470px;height:940px;border-radius:64px;background:#0b0b0b;border:3px solid #3a3833;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
.screen{position:absolute;inset:14px;border-radius:52px;background:linear-gradient(160deg,#2a2622,#141210);overflow:hidden}
.notch{position:absolute;left:50%;top:14px;width:120px;height:34px;border-radius:20px;background:#000;transform:translateX(-50%)}
.clock{position:absolute;width:100%;text-align:center;top:90px;font:300 96px Inter;color:#f5f1ea;letter-spacing:-.02em}
.date{position:absolute;width:100%;text-align:center;top:72px;font:600 22px Inter;color:#d8d2c8}
.note{position:absolute;left:18px;right:18px;background:rgba(245,241,234,.94);color:#141311;border-radius:22px;padding:16px 18px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.note .app{display:flex;align-items:center;gap:10px;font:600 17px Inter;color:#55504a}
.note .ic{width:28px;height:28px;border-radius:8px;background:var(--flame);display:grid;place-items:center;color:#fff}
.note .tx{font:500 20px Inter;line-height:1.3;margin-top:8px}
.note .when{margin-left:auto;font:400 15px Inter;color:#8a847a}
.toast{position:absolute;left:40px;top:946px;padding:16px 24px;border-radius:14px;background:var(--panel);border:1px solid var(--flame);font:500 24px JBM,monospace;color:var(--ink)}
.toast b{color:var(--flame)}
.ok{border-color:var(--safe)} .ok b{color:var(--safe)}
.cap{position:absolute;right:600px;top:44px;font:500 20px JBM,monospace;color:var(--muted)}
</style></head><body><div id="root">
<div class="title">Live: what the cook sees</div>
<div class="cap">simulated kitchen feed · real BoilGuard output</div>
<div class="cam"><img id="cam">
  <div class="hud" style="left:22px;top:18px"><span class="rec" id="dot"></span>LIVE · KITCHEN CAM 01</div>
  <div class="hud" id="ts" style="right:262px;top:18px">17:41:00</div>
</div>
<div class="toast" id="t1"><b>AWS IoT Core</b> → boilguard/kitchen-1/cmd · set_heat 0.35 · hob LOW</div>
<div class="toast ok" id="t2" style="top:1012px"><b>verified</b> · foam falling · heat stays LOW</div>
<div class="phone"><div class="screen">
  <div class="notch"></div>
  <div class="date">Sunday 25 October</div>
  <div class="clock" id="pclock">5:41</div>
  <div id="notes"></div>
</div></div>
</div>
<script>
const SRC0 = 19.0, FPS = 15, START = 0.6;
const NOTES = [
  [8.47, "Heads-up", "Foam is starting to rise (28 mm below the rim). I'm watching the pot closely."],
  [10.87, "Boil-over warning", "Foam is rising fast (20 mm below the rim). Boil-over likely in ~4 s."],
  [11.07, "Heat turned down", "Boil-over predicted in ~4 s: I turned the heat down to LOW."],
  [16.47, "All clear", "Foam is going down. Heat is on LOW. Restore heat from the app when you are ready."],
];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const pad = n => String(n).padStart(4, "0");
const notesEl = document.getElementById("notes");
NOTES.forEach(([at, head, tx], i) => {
  const d = document.createElement("div"); d.className = "note"; d.id = "n" + i;
  d.innerHTML = `<div class="app"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 11h16v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M2 11h20"/></svg></span>BOILGUARD<span class="when">now</span></div><div class="tx"><b>${head}</b><br>${tx}</div>`;
  notesEl.appendChild(d);
});
window.render = function (t, dur) {
  document.getElementById("root").style.opacity = Math.min(ease(t / .3), 1 - ease((t - (dur - .35)) / .35));
  const src = SRC0 + Math.max(0, t - START) + 1.0;
  const img = document.getElementById("cam"), p = `f_live/${pad(Math.min(315, Math.max(1, Math.round((src - SRC0) * FPS) + 1)))}.jpg`;
  if (img.getAttribute("src") !== p) img.setAttribute("src", p);
  const secs = Math.floor(8 + src);
  document.getElementById("ts").textContent = `17:41:${String(secs % 60).padStart(2, "0")}`;
  document.getElementById("dot").style.opacity = (Math.floor(t * 2) % 2) ? .25 : 1;
  // notifications stack from the top, newest first
  const shown = NOTES.map(([at], i) => [i, t - at]).filter(([, dt]) => dt >= 0);
  NOTES.forEach((_, i) => { const el = document.getElementById("n" + i); el.style.opacity = 0; });
  let y = 230;
  shown.slice().reverse().forEach(([i, dt]) => {
    const el = document.getElementById("n" + i), k = ease(dt / .45);
    el.style.opacity = k; el.style.top = (y - (1 - k) * 60) + "px";
    y += el.offsetHeight + 14;
  });
  const t1 = ease((t - 11.2) / .4), t2 = ease((t - 16.7) / .4);
  for (const [id, k] of [["t1", t1], ["t2", t2]]) { const el = document.getElementById(id); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 20}px)`; }
  return null;
};
window.ready = async () => { await document.fonts.ready; const i = document.getElementById("cam"); if (i.getAttribute("src")) await i.decode().catch(() => {}); return true; };
</script></body></html>
